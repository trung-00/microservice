syntax = "proto3";
package shipment;

// Bounded Context 5: Shipment  |  Service: shipment-service  |  DB: MongoDB (shipments)
// Vận đơn được TẠO bằng cách consume Kafka topic "order-created" (không có RPC tạo).
// Danh tính người gọi (x-user-id, x-user-role) được API Gateway gắn vào gRPC metadata.
service ShipmentService {
  rpc GetShipment          (GetShipmentRequest)          returns (Shipment);  // API-SHP-01 | UC12
  rpc GetShipmentByOrder   (GetShipmentByOrderRequest)   returns (Shipment);  // khách chỉ biết oid, chưa biết shipid (CR06)
  rpc UpdateShipmentStatus (UpdateShipmentStatusRequest) returns (Shipment);  // API-SHP-02 | UC11 | TC-SHP-03, 04
}

// uid được sao chép từ sự kiện OrderCreated để kiểm tra quyền xem (UC12: Forbidden -> 403).
// Đây là điểm bổ sung so với ERD (Shipment chỉ có shipid, oid, status). Gateway không trả uid ra ngoài.
message Shipment { int32 shipid = 1; int32 oid = 2; string status = 3; int32 uid = 4; }

message GetShipmentRequest        { int32 shipid = 1; }
message GetShipmentByOrderRequest { int32 oid = 1; }
// status hợp lệ: PENDING, SHIPPING, DELIVERED, CANCELLED
message UpdateShipmentStatusRequest { int32 shipid = 1; string status = 2; }