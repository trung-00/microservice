syntax = "proto3";
package auth;

// Bounded Context 1: Identity & Access  |  Service: auth-service  |  DB: PostgreSQL (User, Role)
service AuthService {
  rpc Register    (RegisterRequest)    returns (RegisterResponse);     // API-AUTH-01
  rpc Login       (LoginRequest)       returns (LoginResponse);        // API-AUTH-02
  rpc VerifyToken (VerifyTokenRequest) returns (VerifyTokenResponse);  // BPM bước 2 (API Gateway gọi)
}

message RegisterRequest  { string username = 1; string password = 2; string email = 3; string phone = 4; }
message RegisterResponse { int32 uid = 1; }

message LoginRequest  { string username = 1; string password = 2; }
message LoginResponse { string access_token = 1; string token_type = 2; int32 expires_in = 3; }

message VerifyTokenRequest  { string token = 1; }
message VerifyTokenResponse { bool valid = 1; int32 uid = 2; string role = 3; }